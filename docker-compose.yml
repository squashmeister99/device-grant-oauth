services:
  postgres:
    image: postgres:15-alpine
    container_name: device-grant-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - device-grant-network

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: device-grant-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_PROXY: passthrough
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_HOST:-localhost}
      KC_HOSTNAME_PORT: ${KEYCLOAK_PUBLIC_PORT:-8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - device-grant-network
    command:
      - "start"
      - "--import-realm"

  device-client:
    build:
      context: ./device-client
      dockerfile: Dockerfile
    container_name: device-grant-client
    environment:
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-device-grant-demo}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-device-client}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      DEVICE_CODE_LIFETIME: ${DEVICE_CODE_LIFETIME:-600}
      POLL_TIMEOUT: ${POLL_TIMEOUT:-300}
      POLLING_INTERVAL_MIN: ${POLLING_INTERVAL_MIN:-2}
      POLLING_INTERVAL_MAX: ${POLLING_INTERVAL_MAX:-120}
      TOKEN_STORAGE_PATH: ${TOKEN_STORAGE_PATH:-/data/tokens.json}
      WEB_UI_PORT: ${WEB_UI_PORT:-8000}
      WEB_UI_HOST: ${WEB_UI_HOST:-0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - device-data:/data
    networks:
      - device-grant-network
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  postgres_data:
  device-data:

networks:
  device-grant-network:
    driver: bridge
